[workspace]
resolver = "2"
members = [
    "crates/skia-rs-core",
    "crates/skia-rs-path",
    "crates/skia-rs-paint",
    "crates/skia-rs-canvas",
    "crates/skia-rs-text",
    "crates/skia-rs-gpu",
    "crates/skia-rs-codec",
    "crates/skia-rs-svg",
    "crates/skia-rs-pdf",
    "crates/skia-rs-skottie",
    "crates/skia-rs-ffi",
    "crates/skia-rs-safe",
    "crates/skia-rs-bench",
    "crates/skia-rs",
    "crates/skia-rs-node",
    "crates/skia-rs-python",
]

# Binding crates (node/python) require external toolchains (napi/pyo3) and
# build cdylibs; keep them out of the default `cargo build` set so a plain
# workspace build stays lean, while `cargo build --workspace` still covers them.
#
# INVARIANT: this list must equal `members` above MINUS the binding crates
# (skia-rs-node, skia-rs-python). When you add a new non-binding crate to
# `members`, add it here too — otherwise it is silently dropped from the
# default `cargo build`/`test`/`clippy` runs (CI uses `--workspace`, which
# overrides default-members, so CI would not catch the omission).
default-members = [
    "crates/skia-rs-core",
    "crates/skia-rs-path",
    "crates/skia-rs-paint",
    "crates/skia-rs-canvas",
    "crates/skia-rs-text",
    "crates/skia-rs-gpu",
    "crates/skia-rs-codec",
    "crates/skia-rs-svg",
    "crates/skia-rs-pdf",
    "crates/skia-rs-skottie",
    "crates/skia-rs-ffi",
    "crates/skia-rs-safe",
    "crates/skia-rs-bench",
    "crates/skia-rs",
]
exclude = ["fuzz"]  # Fuzz crate uses different edition for libfuzzer compatibility

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/skia-rs"
homepage = "https://github.com/quinnjr/skia-rs"
documentation = "https://docs.rs/skia-rs-safe"
authors = ["Joseph R. Quinn"]
rust-version = "1.85"
keywords = ["graphics", "2d", "skia", "rendering", "canvas"]
categories = ["graphics", "rendering::graphics-api", "multimedia::images"]

[workspace.dependencies]
# Internal crates - version is required for crates.io, path is for local dev
skia-rs-core = { version = "0.4.0", path = "crates/skia-rs-core" }
skia-rs-path = { version = "0.4.0", path = "crates/skia-rs-path" }
skia-rs-paint = { version = "0.4.0", path = "crates/skia-rs-paint" }
skia-rs-canvas = { version = "0.4.0", path = "crates/skia-rs-canvas" }
skia-rs-text = { version = "0.4.0", path = "crates/skia-rs-text" }
skia-rs-gpu = { version = "0.4.0", path = "crates/skia-rs-gpu" }
skia-rs-codec = { version = "0.4.0", path = "crates/skia-rs-codec" }
skia-rs-svg = { version = "0.4.0", path = "crates/skia-rs-svg" }
skia-rs-pdf = { version = "0.4.0", path = "crates/skia-rs-pdf" }
skia-rs-ffi = { version = "0.4.0", path = "crates/skia-rs-ffi" }
skia-rs-safe = { version = "0.4.0", path = "crates/skia-rs-safe" }
skia-rs-skottie = { version = "0.4.0", path = "crates/skia-rs-skottie" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math and geometry
glam = { version = "0.29", default-features = false, features = ["std"] }
geo = "0.33"

# GPU backends
ash = "0.38"
wgpu = "23.0"
glow = "0.16"
metal = "0.29"
pollster = "0.4"

# Text and fonts
rustybuzz = "0.18"
fontdb = "0.21"
ttf-parser = "0.24"

# Image codecs
png = "0.17"
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
gif = "0.13"
webp = "0.3"
# ravif: default features pull rav1e with nasm-requiring asm optimisations.
# Disable them so --all-features builds without a system assembler. The
# asm path is a performance upgrade, not a functional one — consumers that
# want it can re-enable via `ravif = { workspace = true, features = ["asm"] }`.
ravif = { version = "0.11", default-features = false, features = ["threading"] }
avif-decode = "1.0"
rawloader = "0.37"

# SVG
roxmltree = "0.20"
usvg = "0.43"

# PDF
pdf-writer = "0.12"
flate2 = "1.0"

# FFI
libc = "0.2"

# Utilities
thiserror = "2.0"
bitflags = "2.6"
bytemuck = { version = "1.18", features = ["derive"] }
smallvec = "1.13"
arrayvec = "0.7"
parking_lot = "0.12"
base64 = "0.22"

# WASM support
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
getrandom = "0.2"

# Testing & Benchmarking
criterion = { version = "0.8.0", features = ["html_reports"] }
proptest = "1.5"
rand = "0.8"
rand_xorshift = "0.3"

# Git hooks
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Benchmark profile - optimized but with debug info for profiling
[profile.bench]
inherits = "release"
debug = true
lto = "thin"

# Workspace-wide lint policy: pedantic + nursery are enforced (the CI clippy
# job and the pre-push/pre-commit hooks run `-D warnings`, which promotes these
# to errors). Individual, justified `#[allow(clippy::..., reason = "...")]`
# attributes at item/module scope override this where a lint is a false
# positive for a faithful Skia port. Each member crate opts in via
# `[lints] workspace = true`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
