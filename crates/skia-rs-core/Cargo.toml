[package]
name = "skia-rs-core"
description = "Core types for skia-rs: geometry, color, and pixel storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/skia-rs-core"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["std"]
std = []
# Deprecated no-op, kept only so dependents that enable it keep building.
# It used to forward to `glam/libm`, but skia-rs-core never used glam and no
# longer depends on it; enabling it changes nothing. Will be removed in the
# next breaking release.
libm = []
serde = ["dep:serde", "bitflags/serde"]

[dependencies]
bytemuck = { workspace = true }
bitflags = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
cargo-husky = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
