name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Format Check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ==========================================================================
  # Clippy Lints
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Enforce clippy pedantic + nursery (configured as warnings in the
      # workspace `[lints]` table) as hard errors. Justified false positives
      # for the Skia port carry narrow `#[allow(..., reason = "...")]`.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Feature-gated GPU backend code is invisible to the default build, so
      # lint it explicitly. Metal only compiles on macOS; see `clippy-macos`.
      - name: Clippy (GPU backends)
        run: cargo clippy --workspace --all-targets --features "wgpu-backend,vulkan,opengl" -- -D warnings

  clippy-macos:
    name: Clippy (macOS, Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lints the Metal backend and the aarch64 (NEON) code paths, neither of
      # which the Linux clippy job compiles.
      - run: cargo clippy --workspace --all-targets --features metal -- -D warnings

  # ==========================================================================
  # Build & Test Matrix
  # ==========================================================================
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: nightly
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Run doc tests
        run: cargo test --workspace --doc

      # The serde feature (derives and deserialization validation) is off
      # by default, so test it explicitly.
      - name: Run serde feature tests
        run: cargo test -p skia-rs-core -p skia-rs-path -p skia-rs-paint --features serde

  # ==========================================================================
  # MSRV Check (Minimum Supported Rust Version)
  # ==========================================================================
  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # ==========================================================================
  # Documentation
  # ==========================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--cfg docsrs` (doc(cfg) badges) needs nightly and is exercised by
      # docs.rs itself; here we just require warning-free docs on stable.
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ==========================================================================
  # Benchmarks (validation only)
  # ==========================================================================
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build benchmarks
        run: cargo build --package skia-rs-bench --release
      - name: Run benchmark validation
        run: cargo test --package skia-rs-bench --release
        continue-on-error: true

  # ==========================================================================
  # Security Audit
  # ==========================================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Security audit is advisory
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit || true

  # ==========================================================================
  # Coverage
  # ==========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        continue-on-error: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ==========================================================================
  # Backend Conformance Testing
  # ==========================================================================
  conformance:
    name: Conformance (${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The scripts are POSIX sh; Windows runners default to PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raster backend - all platforms
          - os: ubuntu-latest
            backend: raster
            features: ""
          - os: macos-latest
            backend: raster
            features: ""
          - os: windows-latest
            backend: raster
            features: ""

          # WebGPU/WGPU backend - all platforms
          - os: ubuntu-latest
            backend: wgpu
            features: "wgpu-backend"
          - os: macos-latest
            backend: wgpu
            features: "wgpu-backend"
          - os: windows-latest
            backend: wgpu
            features: "wgpu-backend"

          # Vulkan backend - Linux/Windows
          - os: ubuntu-latest
            backend: vulkan
            features: "vulkan"
          - os: windows-latest
            backend: vulkan
            features: "vulkan"

          # OpenGL backend - Linux/Windows
          - os: ubuntu-latest
            backend: opengl
            features: "opengl"
          - os: windows-latest
            backend: opengl
            features: "opengl"

          # Metal backend - macOS only
          - os: macos-latest
            backend: metal
            features: "metal"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance-${{ matrix.backend }}-${{ matrix.os }}

      # Install the Vulkan loader/tools on Linux. The runner image is Ubuntu
      # 24.04 (noble); Mesa's lavapipe (mesa-vulkan-drivers, below) provides a
      # software Vulkan ICD, so the LunarG SDK is not needed.
      - name: Install Vulkan (Linux)
        if: matrix.backend == 'vulkan' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools

      # Install Mesa for software rendering on Linux (for CI). Package names
      # are for Ubuntu 24.04: the transitional libegl1-mesa no longer exists.
      - name: Install Mesa (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils libgl1-mesa-dri libegl1 libegl-mesa0 libgbm1 mesa-vulkan-drivers

      # Install ImageMagick for image comparison (raster on Ubuntu only)
      - name: Install ImageMagick
        if: matrix.backend == 'raster' && matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y imagemagick

      # Build with specific backend features
      - name: Build (${{ matrix.backend }})
        run: cargo build --workspace --features "${{ matrix.features }}"

      # Run conformance tests for this backend. This is the gate: the raster
      # conformance test fails the job when any case exceeds MAX_RMSE
      # (0.01), on every OS (the tolerance is meant to hold across platforms).
      - name: Run conformance tests (${{ matrix.backend }})
        run: cargo test --workspace --features "${{ matrix.features }}" -- --test-threads=1 conformance
        env:
          SKIA_RS_BACKEND: ${{ matrix.backend }}
          # Use software rendering in CI
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 4.5
          # Disable GPU for WGPU in CI (use CPU adapter)
          WGPU_BACKEND: ${{ matrix.backend == 'wgpu' && 'gl' || '' }}

      # Generate test images. Only the raster backend has a canvas renderer;
      # the GPU backends are covered by the build and test steps above.
      # Run even when the conformance test failed, so its divergences are
      # still reported and uploaded.
      - name: Generate test images
        if: ${{ !cancelled() && matrix.backend == 'raster' }}
        run: cargo run -p skia-rs-safe --example conformance_gen -- --backend raster --output-dir conformance_output

      # Compare against reference images with ImageMagick, for the summary
      # report only (informational: the conformance test above gates).
      - name: Compare with reference images
        if: ${{ !cancelled() && matrix.backend == 'raster' && matrix.os == 'ubuntu-latest' }}
        run: |
          mkdir -p conformance_results
          # A reference with no generated image means a case stopped being
          # produced (or was renamed): that is a failure, not a skip.
          for ref in conformance/reference/*.png; do
            base=$(basename "$ref")
            if [ ! -f "conformance_output/$base" ]; then
              echo "FAIL ${{ matrix.backend }}: $base - MISSING (no generated image)" >> conformance_results/report.txt
            fi
          done
          for img in conformance_output/*.png; do
            if [ -f "$img" ]; then
              base=$(basename "$img")
              ref="conformance/reference/$base"
              if [ -f "$ref" ]; then
                # RMSE as "absolute (normalized)"; judge the normalized
                # value against the conformance test's MAX_RMSE (0.01).
                diff=$(compare -metric RMSE "$img" "$ref" null: 2>&1 || true)
                norm=$(echo "$diff" | sed -n 's/.*(\([0-9.eE+-]*\)).*/\1/p')
                if [ -n "$norm" ] && awk -v n="$norm" 'BEGIN { exit !(n + 0 <= 0.01) }'; then
                  result=PASS
                else
                  result=FAIL
                fi
                echo "$result ${{ matrix.backend }}: $base - RMSE: $diff" >> conformance_results/report.txt
              else
                # A new case without a committed reference was never checked.
                echo "FAIL ${{ matrix.backend }}: $base - NO REFERENCE" >> conformance_results/report.txt
              fi
            fi
          done
        continue-on-error: true

      # Every job uploads something, so the summary lists every row (with
      # "Not compared" where no images are generated or compared).
      - name: Record comparison status
        if: always()
        run: |
          mkdir -p conformance_results
          if [ ! -f conformance_results/report.txt ]; then
            echo "not compared" > conformance_results/status.txt
          fi

      # Upload conformance results
      - name: Upload conformance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: ignore
          name: conformance-${{ matrix.backend }}-${{ matrix.os }}
          path: |
            conformance_output/
            conformance_results/
          retention-days: 7

  # ==========================================================================
  # Conformance Summary
  # ==========================================================================
  conformance-summary:
    name: Conformance Summary
    runs-on: ubuntu-latest
    needs: conformance
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download all conformance results
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: all-results
          merge-multiple: false

      - name: Generate summary report
        run: |
          echo "# Backend Conformance Report" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image comparison against the references runs for raster on Ubuntu;" >> $GITHUB_STEP_SUMMARY
          echo "every row's conformance test gates the job (overall: ${{ needs.conformance.result }})." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | OS | Image comparison |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|------------------|" >> $GITHUB_STEP_SUMMARY

          for dir in all-results/conformance-*/; do
            if [ -d "$dir" ]; then
              backend_os=$(basename "$dir" | sed 's/conformance-//')
              backend=$(echo "$backend_os" | cut -d'-' -f1)
              os=$(echo "$backend_os" | cut -d'-' -f2-)

              report="$dir/conformance_results/report.txt"
              if [ "$backend" != "raster" ] || [ "$os" != "ubuntu-latest" ]; then
                # Images are compared for raster on Ubuntu only; this row's
                # conformance test still gates the job (overall result above).
                status="➖ Not compared here (see overall result)"
              elif [ ! -f "$report" ]; then
                status="⚠️ No results"
              elif grep -q '^FAIL ' "$report"; then
                status="❌ Diverged"
              else
                status="✅ Pass"
              fi

              echo "| $backend | $os | $status |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Details" >> $GITHUB_STEP_SUMMARY

          for dir in all-results/conformance-*/; do
            if [ -d "$dir" ] && [ -f "$dir/conformance_results/report.txt" ]; then
              backend_os=$(basename "$dir" | sed 's/conformance-//')
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### $backend_os" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat "$dir/conformance_results/report.txt" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
